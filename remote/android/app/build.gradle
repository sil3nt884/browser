plugins {
    id "com.android.application"
}

android {
    namespace "org.umbra.remote"
    compileSdk 35

    defaultConfig {
        applicationId "org.umbra.remote"
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName "0.3"
    }

    buildTypes {
        release {
            minifyEnabled false
            // Sideloaded, not published: sign with the debug key so the APK
            // installs without a keystore. Use a real key before sharing it.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation "com.squareup.okhttp3:okhttp:4.12.0"
}
