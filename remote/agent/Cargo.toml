[package]
name = "umbra-remote"
version = "0.1.0"
edition = "2024"

[dependencies]
base64 = "0.23.1"
futures-util = "0.3.34"
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "process", "io-util", "fs"] }
tokio-tungstenite = "0.30.0"
tray-icon = "0.26.1"
wasapi = "0.26.0"
windows = { version = "0.62", features = ["Foundation", "Graphics_Capture", "Graphics_DirectX", "Graphics_DirectX_Direct3D11", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_Media_MediaFoundation", "Win32_System_WinRT_Direct3D11", "Win32_System_WinRT_Graphics_Capture", "Win32_System_Ole", "Win32_System_Variant", "Win32_UI_WindowsAndMessaging", "Win32_Foundation", "Win32_Media_Audio", "Win32_System_Com", "Win32_System_Diagnostics_ToolHelp", "Win32_System_WinRT"] }
windows-core = "0.62"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
strip = true
opt-level = 3

